services:
  mysql:
    image: mysql:8.4
    container_name: spotify-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: spotify_hackathon
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:7
    container_name: spotify-redis
    ports:
      - "6379:6379"

volumes:
  mysql_data:
