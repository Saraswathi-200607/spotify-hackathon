# =========================
# SERVER
# =========================

server.port=8080


# =========================
# MYSQL DATABASE
# =========================

spring.datasource.url=jdbc:mysql://localhost:3307/spotify_hackathon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=root

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false


# =========================
# REDIS
# =========================

spring.data.redis.host=localhost
spring.data.redis.port=6379


# =========================
# JWT
# =========================

app.jwt.secret=change-this-secret-key-to-a-long-random-value-for-hackathon
app.jwt.expiration-ms=86400000


# =========================
# JSON
# =========================

spring.jackson.serialization.write-dates-as-timestamps=false